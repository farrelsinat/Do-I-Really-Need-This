<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Result — Do I Really Need This?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF8F5;
            background-image: 
                radial-gradient(at 10% 10%, rgba(216, 232, 222, 0.65) 0px, transparent 50%),
                radial-gradient(at 90% 15%, rgba(232, 226, 245, 0.65) 0px, transparent 50%),
                radial-gradient(at 50% 95%, rgba(252, 243, 214, 0.7) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .font-serif-aesthetic {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="text-[#2D312E] min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white/85 backdrop-blur-md border border-[#E6E2D8] p-8 sm:p-9 rounded-[2rem] shadow-[0_20px_50px_rgba(44,74,62,0.07)]">
        
        <!-- Header Label -->
        <div class="text-center mb-6">
            <span class="inline-block px-3 py-1 text-[11px] font-semibold tracking-widest uppercase rounded-full bg-[#F3F0EA] text-[#6E6A61]">
                Do I Really Need This?
            </span>
        </div>

        <!-- Score Circle / Box -->
        <div class="text-center bg-[#F7F9F7] border border-[#E1EAE4] rounded-3xl py-6 px-4 mb-7">
            <p class="text-xs font-semibold text-[#688275] uppercase tracking-widest mb-1">Your Score</p>
            <p class="font-serif-aesthetic text-5xl font-bold text-[#2C4A3E]">
                {{ total_score }}<span class="text-2xl font-normal text-[#94A69C]">/{{ max_total_score }}</span>
            </p>
        </div>

        <!-- Verdict Headline & Description -->
        <div class="text-center mb-8">
            <h1 class="font-serif-aesthetic text-2xl sm:text-3xl font-bold text-[#1F2923] mb-3 leading-snug">
                “{{ headline }}”
            </h1>
            <p class="text-[#5C645F] leading-relaxed text-sm">
                {{ description }}
            </p>
        </div>

        <!-- Category Breakdown -->
        <div class="space-y-4 mb-8 bg-[#FAF8F5] p-5 rounded-2xl border border-[#EAE6DD]">
            {% for category, pct in percentages.items() %}
            <div>
                <div class="flex justify-between text-xs font-semibold mb-1.5">
                    <span class="text-[#4A524D]">{{ category }}</span>
                    <span class="text-[#2C4A3E]">{{ pct }}%</span>
                </div>
                <div class="w-full bg-[#E8E4DC] rounded-full h-2 overflow-hidden">
                    <div class="h-2 rounded-full transition-all duration-500
                        {% if category == 'Fandom' %} bg-[#8B7EC8]
                        {% elif category == 'Emotional Attachment' %} bg-[#D9B14A]
                        {% else %} bg-[#527966] {% endif %}" 
                        style="width: {{ pct }}%">
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Action Button -->
        <a href="/" class="block text-center w-full py-3.5 bg-[#ECE8E0] hover:bg-[#E1DCD1] text-[#3A3F3B] text-sm font-semibold rounded-2xl transition">
            ↺ Take It Again
        </a>
    </div>
</body>
</html>
